name: run python tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Permite ejecutar el workflow manualmente desde la interfaz

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      # Only the read-only Drive integration tests need real credentials; every other
      # test is mocked/offline, so no other secret is exposed to the test job.
      GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
      GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
      BUY_RECOMMENDATIONS_ID: ${{ secrets.BUY_RECOMMENDATIONS_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with pytest
        run: |
          pytest -v

  # Supply chain: known vulnerabilities in the dependencies, and secrets
  # committed at any point of the history. No secrets are exposed to this job.
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans the whole history

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Resolves requirements-dev.txt (requirements.txt included) and checks
      # every package against the PyPI / OSV advisory databases
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-dev.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
