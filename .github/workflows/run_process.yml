name: run process

on:
  schedule:
    # execution times in Madrid
    - cron: '0 17 * * 1-5' # 18:00 in winter, 19:00 in summer

  workflow_dispatch:

permissions:
  contents: write  

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: configure python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: execute main.py
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          ALPHA_API_KEY: ${{ secrets.ALPHA_API_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          BUY_RECOMMENDATIONS_ID: ${{ secrets.BUY_RECOMMENDATIONS_ID }}
          ANALYSIS_FILE_ID: ${{ secrets.ANALYSIS_FILE_ID }}
          DEEPKSEEK_API_KEY: ${{ secrets.DEEPKSEEK_API_KEY }}
          ALPHA_VANTAGE_URL: ${{ vars.ALPHA_VANTAGE_URL }}
          REVENUE_PERCENTAGE: ${{ vars.REVENUE_PERCENTAGE }}
          SYMBOLS_INTEREST_LIST: ${{ vars.SYMBOLS_INTEREST_LIST }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          FORCE_OPINION: ${{ vars.FORCE_OPINION }}
          GPT_MODEL_NAME: ${{ vars.GPT_MODEL_NAME }}
          TRANSACTIONS_MAX_RECORDS: ${{ vars.TRANSACTIONS_MAX_RECORDS }}
          MIN_BUY_CONFIDENCE: ${{ vars.MIN_BUY_CONFIDENCE }}
          NEWS_SENT_ANALYSIS: ${{ vars.NEWS_SENT_ANALYSIS }}
          LLM_AUDIT_ENABLED: ${{ vars.LLM_AUDIT_ENABLED }}
        run: python main.py
