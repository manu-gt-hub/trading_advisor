# Weekly pull requests for outdated or vulnerable dependencies and actions.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request a week for all actions instead of one per action
    groups:
      actions:
        patterns: ["*"]
